<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Battery card</title><style>
body{margin:0;padding:24px 15px;background:#fff;font-family:"Quicksand",system-ui,sans-serif}
.wrap{max-width:1110px;margin:0 auto}
.card{position:relative;height:160px;border:1px solid rgba(0,0,0,.125);border-radius:.25rem;overflow:hidden;background:#081722;display:flex}
.scene-battery{position:absolute;inset:0}
.scene-battery svg{display:block;width:100%;height:100%}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(-90deg,rgba(255,255,255,0.2),white 80%)}
.card-block{position:relative;z-index:2;margin:auto 15px;max-width:640px}
h2{color:#717171;font-weight:500;font-size:1.6rem;margin:0 0 .4rem;text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:lightgrey;text-underline-offset:2px}
.date{color:#6c757d;font-size:1rem;margin:0 0 .3rem}.text{color:#000;font-size:.95rem;margin:0}

<div class="card-block"><h2>Deep Reinforcement Learning for Grid Scale Lithium-ion Battery Optimisation</h2><p class="date">Oct 10, 2022</p><p class="text">Wholesale arbitrage with DQN agents, benchmarked against MILP</p></div></div></div>
<script type="module">
/*
 * One trading day of the post's 10 MW / 20 MWh battery, as its Double Dueling
 * DQN agent ran it: the hourly wholesale price, the power it chose (positive
 * discharges, negative charges) and the state of charge that follows. Pure, so
 * the build and the page (which inlines this file, exports stripped) agree.
 */
const BATTERY = { mw: 10, mwh: 20, socMin: 0.2, socMax: 1 };

/** The day's hours from the post's CSV rows: `{ price, mw, soc }`, soc at the hour's start. */
function dayOf(rows) {
  return rows.map(({ price, action, soc }) => ({ price, mw: action * BATTERY.mw, soc }));
}

/**
 * The battery at `t` hours into the day (0 to 24). Power is held for the whole
 * hour, so the state of charge runs in a straight line across it:
 * SoC(t + 1) = SoC(t) - P·1 h / E, the post's own record.
 */
function stateAt(day, t) {
  const n = day.length;
  const at = ((t % n) + n) % n;
  const hour = Math.floor(at);
  const { price, mw, soc } = day[hour];
  const into = at - hour;
  return { t: at, hour, price, mw, soc: soc - (mw * into) / BATTERY.mwh };
}

const DAY = [{"price":34.74,"mw":0,"soc":0.2},{"price":39.93,"mw":0,"soc":0.2},{"price":33.78,"mw":0,"soc":0.2},{"price":31.29,"mw":0,"soc":0.2},{"price":17.4,"mw":0,"soc":0.2},{"price":12.18,"mw":-10,"soc":0.2},{"price":16.9,"mw":-6.000122,"soc":0.7},{"price":23.4,"mw":0,"soc":1},{"price":38.02,"mw":0,"soc":1},{"price":37.84,"mw":0,"soc":1},{"price":49.34,"mw":10,"soc":1},{"price":49.42,"mw":5.9998702999999995,"soc":0.5},{"price":37.79,"mw":0,"soc":0.2},{"price":32.04,"mw":0,"soc":0.2},{"price":31.97,"mw":0,"soc":0.2},{"price":30.93,"mw":0,"soc":0.2},{"price":30.9,"mw":-5,"soc":0.2},{"price":30.98,"mw":-10,"soc":0.45},{"price":44.35,"mw":-1.0000194,"soc":0.95},{"price":79,"mw":10,"soc":1},{"price":43.95,"mw":5.9998702999999995,"soc":0.5},{"price":40.74,"mw":0,"soc":0.2},{"price":37.91,"mw":0,"soc":0.2},{"price":37.92,"mw":0,"soc":0.2}];
const SPH = 1.25, STILL_HOUR = 19.5;
const stage = document.querySelector(".scene-battery");
const svg = stage.querySelector("svg");
const still = matchMedia("(prefers-reduced-motion: reduce)");
// each lamp is restyled only when its own size can show the change: 60 steps of
// charge up close, 10 far off, so the far lamps cost little while the plant moves
const lamps = [...svg.querySelectorAll(".bt-lamp")].map((el) => ({ el, steps: +el.dataset.steps, shown: -1 }));
const fans = [...svg.querySelectorAll("[data-fan]")].map((el) => ({ el, kind: el.dataset.fan, ph: +el.dataset.ph }));
// fans: the containers' air conditioners tick over and work harder with the

const REV = { hvac: [0.25, 1.1], pcs: [0, 1.4] };
let power = 0, spin = { hvac: REV.hvac[0], pcs: 0 }, angle = { hvac: 0, pcs: 0 };
