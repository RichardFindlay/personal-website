// ERA5 grid in the post card. Edit the build, not this file.
// The weather the thumbnail shows, as one pure module that the build and the
// page (which inlines this file with its exports stripped) both read.
//
// The post's ERA5 input: the area its downloader requests from the CDS
// (scripts/preprocessing/ERA5_downloader.py: 'area': [61.19, -11.95, 49.78, 1.76])
// on ERA5's 0.25° grid, hourly fields interpolated to half-hour periods (HH) by
// averaging the hours either side (preprocessing_funcs.interpolate_4d). The
// decoder forecasts the next 48 HH, so one loop of the strip is one forecast day.
const AREA = { north: 61.19, west: -11.95, south: 49.78, east: 1.76 };
const CELL = 0.25;
const COLS = Math.ceil((AREA.east - AREA.west) / CELL - 1e-9);   // 55
const ROWS = Math.ceil((AREA.north - AREA.south) / CELL - 1e-9); // 46
const STEPS = 48;
const HOURS = STEPS / 2;

// Equidistant cylindrical, true to scale on the domain's middle parallel, so the
// lat/lon grid stays a grid. Kilometres east and north of the domain's centre.
const LAT0 = (AREA.north + AREA.south) / 2;
const LON0 = (AREA.west + AREA.east) / 2;
const KX = 111.32 * Math.cos((LAT0 * Math.PI) / 180), KY = 111.13;
const km = (lon, lat) => [(lon - LON0) * KX, (lat - LAT0) * KY];

// Cell (i down from the north edge, j east from the west edge): its bounds,
// cut at the area's edges, and the point it is sampled at, its centre.
function cellOf(i, j) {
  const west = AREA.west + j * CELL, east = Math.min(AREA.east, west + CELL);
  const north = AREA.north - i * CELL, south = Math.max(AREA.south, north - CELL);
  return { west, east, north, south, lon: (west + east) / 2, lat: (north + south) / 2 };
}

// ── The depressions ─────────────────────────────────────────────────────────
// A family of Atlantic lows on one track from the south-west, each a day behind
// the last, moving at 55 km/h (a mobile winter depression), so one crosses the
// domain each forecast day and the loop closes on the next. Each turns
// anticlockwise (northern hemisphere) as it goes, 8° an hour, and deepens out
// of the Atlantic and fills beyond the North Sea.
const SPEED = 55;
const SPACING = SPEED * HOURS;                 // 1320 km between lows
const BEARING = (58 * Math.PI) / 180;                 // heading east-north-east
const HEADING = [Math.sin(BEARING), Math.cos(BEARING)];
const SPIN = (8 * Math.PI) / 180;              // rad an hour, anticlockwise
// where the low of the loop's first step stands: off the west of Ireland
const ORIGIN = km(-11.5, 54.2);
const ARMS = [
  // phase (rad), inner and outer reach (km), half-width (km), strength
  { phase: 0, from: 60, to: 840, width: 95, strength: 0.95 },
  { phase: (2 * Math.PI) / 3 + 0.25, from: 90, to: 620, width: 72, strength: 0.8 },
  { phase: (4 * Math.PI) / 3 + 0.1, from: 120, to: 450, width: 56, strength: 0.62 },
];
const PITCH = 2.3;                             // cot of the arms' pitch angle
const R0 = 250;                                // radius where an arm sits at its phase
const CORE = { radius: 170, slot: 38 };        // the dense head and its clear centre

// Each low's place along the track is s km past ORIGIN: lows sit at
// s = SPEED·h + k·SPACING. Its strength ramps up out of the Atlantic and down
// past the North Sea, both off the plinth, so none appears or vanishes in view.
const LIFE = { born: -3200, grown: -1700, fading: 900, gone: 1700 };
const ramp = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function lowsAt(hours) {
  const out = [];
  const base = ((SPEED * hours) % SPACING + SPACING) % SPACING;
  for (let k = -3; k <= 2; k++) {
    const s = base + k * SPACING;
    const life = ramp(LIFE.born, LIFE.grown, s) * (1 - ramp(LIFE.fading, LIFE.gone, s));
    if (life <= 0) continue;
    // a young low is a smaller spiral; it reaches full size a day before landfall
    const size = 0.6 + 0.4 * ramp(LIFE.born, LIFE.grown + 600, s);
    out.push({ key: k, s, life, size, at: [ORIGIN[0] + HEADING[0] * s, ORIGIN[1] + HEADING[1] * s], spin: (SPIN * s) / SPEED });
  }
  return out;
}

// An arm's centreline: the trailing log spiral φ = phase + spin − PITCH·ln(r/R0),
// so going outward along it turns clockwise and the arms trail an anticlockwise
// turn. Its half-width tapers to nothing at both ends.
const armAngle = (arm, r, spin) => arm.phase + spin - PITCH * Math.log(r / R0);
function armWidth(arm, r) {
  const u = (r - arm.from) / (arm.to - arm.from);
  if (u <= 0 || u >= 1) return 0;
  return arm.width * Math.sin(Math.PI * Math.pow(u, 0.7)) ** 0.8;
}

// Cloud cover in [0, 1] at a point (km) for one low: the arms' bands, Gaussian
// across, plus the dense head round a clearer centre.
function lowCover(low, x, y) {
  const dx = (x - low.at[0]) / low.size, dy = (y - low.at[1]) / low.size, r = Math.hypot(dx, dy);
  if (r > 1100) return 0;
  const phi = Math.atan2(dy, dx);
  let clear = 1;
  for (const arm of ARMS) {
    const w = armWidth(arm, r);
    if (!w) continue;
    let d = phi - armAngle(arm, r, low.spin);
    d = ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
    const across = (Math.abs(d) * r) / Math.sqrt(1 + PITCH * PITCH);
    clear *= 1 - arm.strength * Math.exp(-((across / w) ** 2));
  }
  const head = Math.exp(-((r / CORE.radius) ** 2)) * (1 - Math.exp(-((r / CORE.slot) ** 2)));
  clear *= 1 - 0.9 * head;
  return low.life * (1 - clear);
}
function cover(lows, x, y) {
  let clear = 1;
  for (const low of lows) clear *= 1 - lowCover(low, x, y);
  return 1 - clear;
}

// The field the model reads at HH step n: on the hour, ERA5's own field; on a
// half hour, the mean of the hours either side, as the post's preprocessing does.
function fieldAt(step) {
  const hour = Math.floor(step / 2), out = new Float32Array(ROWS * COLS);
  const sample = (h, w) => {
    const lows = lowsAt(h);
    for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) {
      const c = cellOf(i, j), [x, y] = km(c.lon, c.lat);
      out[i * COLS + j] += w * cover(lows, x, y);
    }
  };
  if (step % 2 === 0) sample(hour, 1);
  else { sample(hour, 0.5); sample(hour + 1, 0.5); }
  return out;
}

const A = [0.29783,0.07434,0.15836,-0.13982], O = [1145,42.8];
const G0 = [1116.655,-71.342], GJ = [1121.352,-70.169], GI = [1112.256,-67.457];
const SLIDE = [5.3657,1.3394];
const LEVELS = [0.18,0.4,0.62,0.84];
const SECONDS_PER_STEP = 1;
const stage = document.querySelector(".scene-cyclone");
const svg = stage.querySelector("svg");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const slots = new Map([...svg.querySelectorAll("[data-low]")].map((g) => [Number(g.dataset.low), g]));
const det = A[0] * A[3] - A[2] * A[1];
const inv = [A[3] / det, -A[1] / det, -A[2] / det, A[0] / det];
const r3 = (v) => Math.round(v * 1000) / 1000;
function lows(hours) {
  const seen = new Set();
  for (const low of lowsAt(hours)) {
    const g = slots.get(low.key);
    if (!g) continue;
    seen.add(low.key);
    const c = Math.cos(low.spin) * low.size, s = Math.sin(low.spin) * low.size;
    // A·(size·R)·A⁻¹, then the low's centre on the deck
    const ar = [A[0] * c + A[2] * s, A[1] * c + A[3] * s, -A[0] * s + A[2] * c, -A[1] * s + A[3] * c];
    const m = [ar[0] * inv[0] + ar[2] * inv[1], ar[1] * inv[0] + ar[3] * inv[1], ar[0] * inv[2] + ar[2] * inv[3], ar[1] * inv[2] + ar[3] * inv[3]];
    const to = [O[0] + A[0] * low.at[0] + A[2] * low.at[1], O[1] + A[1] * low.at[0] + A[3] * low.at[1]];
    const e = to[0] - (m[0] * O[0] + m[2] * O[1]), f = to[1] - (m[1] * O[0] + m[3] * O[1]);
    g.setAttribute("transform", "matrix(" + [m[0], m[1], m[2], m[3], e, f].map(r3).join(" ") + ")");
    g.style.opacity = r3(low.life);
  }
  for (const [key, g] of slots) if (!seen.has(key)) g.style.opacity = 0;
}
const buffers = [...svg.querySelectorAll("[data-buffer]")];
const round1 = (v) => Math.round(v * 10) / 10;
function paint(buffer, step) {
  const field = fieldAt(step), d = LEVELS.map(() => []);
  const fx = (AREA.east - AREA.west) / CELL - (COLS - 1), fy = (AREA.north - AREA.south) / CELL - (ROWS - 1);
  for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) {
    const v = field[i * COLS + j];
    let n = -1;
    while (n + 1 < LEVELS.length && v >= LEVELS[n + 1]) n++;
    if (n < 0) continue;
    const j1 = j === COLS - 1 ? j + fx : j + 1, i1 = i === ROWS - 1 ? i + fy : i + 1;
    const p = (a, b) => round1(G0[0] + b * (GJ[0] - G0[0]) + a * (GI[0] - G0[0])) + " " + round1(G0[1] + b * (GJ[1] - G0[1]) + a * (GI[1] - G0[1]));
    d[n].push("M" + p(i, j) + "L" + p(i, j1) + "L" + p(i1, j1) + "L" + p(i1, j) + "Z");
  }
  buffer.querySelectorAll("path").forEach((el, n) => el.setAttribute("d", d[n].join("")));
}
// The grid holds each half-hour's field and crossfades to the next in 0.4 s,
// while the slider on the plinth's face moves on one tick.
const slider = svg.querySelector(".cy-slider");
let shown = -1, front = 0, fadeFrom = null, from = 0;
function grid(seconds) {
  const step = Math.floor(seconds / SECONDS_PER_STEP) % STEPS;
  if (step !== shown) {
    if (shown < 0) { paint(buffers[0], step); buffers[0].style.opacity = 1; buffers[1].style.opacity = 0; from = step; }
    else { front ^= 1; paint(buffers[front], step); fadeFrom = seconds; from = shown; }
    shown = step;
  }
  const t = fadeFrom === null ? 1 : Math.min(1, (seconds - fadeFrom) / 0.4), e = t * t * (3 - 2 * t);
  if (fadeFrom !== null) { buffers[front].style.opacity = r3(e); buffers[front ^ 1].style.opacity = r3(1 - e); }
  const along = from + (step - from) * e;
  slider.setAttribute("transform", "translate(" + r3(SLIDE[0] * along) + " " + r3(SLIDE[1] * along) + ")");
}
function draw(seconds) {
  lows(seconds / SECONDS_PER_STEP / 2);
  grid(seconds);
}
const START = 0;
const GAP = 1000 / 30 - 2;
let frame = 0, visible = false, t0 = 0, last = -Infinity;
function tick(now) {
  if (!t0) t0 = now - START * 1000;
  if (now - last >= GAP) { last = now; draw(((now - t0) / 1000) % (STEPS * SECONDS_PER_STEP)); }
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
draw(START);
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible && !frame && !still.matches) frame = requestAnimationFrame(tick);
}, { rootMargin: "120px 0px" }).observe(stage);
</script></body></html>
