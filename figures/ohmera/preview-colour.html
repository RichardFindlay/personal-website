<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ohmera.ai card</title>

<style>body{margin:0;padding:24px 15px;background:#fff;font-family:Quicksand,sans-serif}.card{position:relative;display:flex;max-width:1110px;margin:0 auto 24px;height:160px;overflow:hidden;border:1px solid rgba(0,0,0,.125);border-radius:4px;background:#a9c7e0}

.text{position:relative;z-index:2;margin:auto 15px}h2{margin:0 0 8px;color:#717171;font-weight:500;font-size:2rem;text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:lightgrey;text-underline-offset:2px}

const scene = document.querySelector(".ohmera-scene");
scene.insertAdjacentHTML("beforeend", await (await fetch("../../staticfiles/image/thumbnails/ohmera/offshore-colour.svg")).text());

</script></body></html>
