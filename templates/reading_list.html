{% extends 'page.html' %}
{% load static %}
{% block content %}
        <section class="panel glass">
            <div class="panel-head">
                <span class="panel-num">01</span>
                <h1 class="panel-title">READING LIST</h1>
                <div class="panel-rule"></div>
            </div>
            <div class="shelf">
                {% for book in books %}
                <a class="book" href="{{ book.url }}" target="_blank" rel="noopener"><img class="book-cover" src="{% static 'image/books/'|add:book.file %}" alt="{{ book.title }}" width="120" height="180" loading="lazy"></a>
                {% endfor %}
            </div>
        </section>
{% endblock %}
