        <title>{{ seo_page.title }}</title>
        <meta name="description" content="{{ seo_page.description }}">
        <link rel="canonical" href="{{ canonical_url }}">
        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XC3XLQBL96"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-XC3XLQBL96');
        </script>

        <meta name="google" content="notranslate" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="{{ seo_page.kind }}">
        <meta property="og:url" content="{{ canonical_url }}">
        <meta property="og:title" content="{{ seo_page.title }}">
        <meta property="og:description" content="{{ seo_page.description }}">
        <meta property="og:image" content="{{ seo_page.image }}">
        <meta property="og:site_name" content="Richard Findlay">
        <meta property="og:locale" content="en_GB">
        {% if seo_page.published %}<meta property="article:published_time" content="{{ seo_page.published|date:'Y-m-d' }}">{% endif %}

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:site" content="@__RichFind__">
        <meta name="twitter:title" content="{{ seo_page.title }}">
        <meta name="twitter:description" content="{{ seo_page.description }}">
        <meta name="twitter:image" content="{{ seo_page.image }}">

        {% if json_ld %}<script type="application/ld+json">{{ json_ld }}</script>{% endif %}
